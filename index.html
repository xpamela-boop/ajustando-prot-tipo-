<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central do Protótipo</title>
  <style>
    /* ==========================================
       ESTILOS (CSS)
       ========================================== */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --background: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --error: #ef4444;
      --radius: 10px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .app-header h1 {
      font-size: 1.75rem;
      color: var(--text-main);
    }

    .app-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card h2 {
      font-size: 1.15rem;
    }

    .card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button[type="submit"] {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
      background-color: var(--primary-hover);
    }

    .btn-clear {
      background: none;
      border: none;
      color: var(--error);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-clear:hover {
      text-decoration: underline;
    }

    .activity-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .activity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: var(--background);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      animation: fadeIn 0.25s ease;
    }

    .activity-item .time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 4px;
    }

    .delete-btn:hover {
      color: var(--error);
    }

    .empty-state {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 12px 0;
    }

    /* Feedback Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--text-main);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      font-weight: 500;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 1000;
    }

    .toast.hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>⚡ Central do Protótipo</h1>
      <p>Teste as interações e receba feedbacks em tempo real</p>
    </header>

    <main>
      <section class="card">
        <h2>➕ Registrar Nova Tarefa</h2>
        <p>Insira uma ação para testar o fluxo do protótipo.</p>
        
        <form id="actionForm">
          <div class="form-group">
            <label for="userInput">Descrição da Tarefa</label>
            <input 
              type="text" 
              id="userInput" 
              placeholder="Ex: Validar fluxo da tela principal" 
              required
              autocomplete="off"
            >
          </div>
          <button type="submit">Confirmar e Salvar</button>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>📋 Histórico de Ações</h2>
          <button id="clearBtn" class="btn-clear" type="button">Limpar Tudo</button>
        </div>
        <p>Atividades registradas durante os testes:</p>
        
        <ul id="activityList" class="activity-list">
          <li class="empty-state">Nenhuma atividade registrada ainda.</li>
        </ul>
      </section>
    </main>

    <div id="toast" class="toast hidden">Ação realizada!</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('actionForm');
      const input = document.getElementById('userInput');
      const activityList = document.getElementById('activityList');
      const clearBtn = document.getElementById('clearBtn');
      const toast = document.getElementById('toast');
      let toastTimer = null;

      // 1. Processar envio do formulário
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const value = input.value.trim();

        if (!value) return;

        // Remove a mensagem de lista vazia se ela existir
        const emptyState = activityList.querySelector('.empty-state');
        if (emptyState) {
          emptyState.remove();
        }

        // Cria o novo item na lista
        const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const li = document.createElement('li');
        li.className = 'activity-item';
        li.innerHTML = `
          <span>
            <strong>• ${escapeHTML(value)}</strong> 
            <span class="time">(${time})</span>
          </span>
          <button class="delete-btn" title="Remover item">&times;</button>
        `;

        // Evento para deletar o item individual
        li.querySelector('.delete-btn').addEventListener('click', () => {
          li.remove();
          if (activityList.children.length === 0) {
            renderEmptyState();
          }
          showToast('Item removido!');
        });

        activityList.prepend(li);
        input.value = '';
        showToast('Ação registrada com sucesso!');
      });

      // 2. Limpar toda a lista
      clearBtn.addEventListener('click', () => {
        renderEmptyState();
        showToast('Histórico limpo!');
      });

      // 3. Função para renderizar o estado vazio
      function renderEmptyState() {
        activityList.innerHTML = '<li class="empty-state">Nenhuma atividade registrada ainda.</li>';
      }

      // 4. Função para exibir a mensagem temporária (Toast)
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('hidden');

        if (toastTimer) clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
          toast.classList.add('hidden');
        }, 2500);
      }

      // 5. Proteção contra XSS ao inserir texto
      function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
      }
    });
  </script>
</body>
</html>
